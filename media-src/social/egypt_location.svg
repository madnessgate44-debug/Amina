<?xml version="1.0" encoding="UTF-8"?>
<!--
  Egypt's position & the Suez Canal — off_soc_u1_l1 (موقع بلدي مصر الجغرافي والفلكي).
  Text-free schematic map: five numbered callouts (Africa, the Mediterranean,
  the Red Sea, the Suez Canal, and the Tropic of Cancer). Wording lives in the
  catalog's localized legend/alt HTML. Numbers map to the lesson's five points.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="msea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a8"/>
      <stop offset="1" stop-color="#e3b878"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#msea)"/>

  <!-- Europe (top-left) -->
  <path d="M120,40 L360,32 L430,86 L360,150 L180,150 L120,110 Z"
        fill="#a3b18a" stroke="#3f6212" stroke-width="5"/>

  <!-- Africa (left-centre): the continent Egypt sits in -->
  <path d="M110,250 L440,232 L500,300 L470,470 L360,560 L200,560 L120,470 Z"
        fill="url(#mland)" stroke="#a16207" stroke-width="5"/>

  <!-- Arabian peninsula / Asia (right) -->
  <path d="M580,210 L790,230 L840,330 L740,530 L610,540 L560,420 L590,300 Z"
        fill="url(#mland)" stroke="#a16207" stroke-width="5"/>

  <!-- Red Sea: a diagonal channel between Africa and Arabia (the water shows through) -->
  <path d="M470,300 L560,250 L600,420 L520,520 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Suez Canal: the short link from the Mediterranean down to the Red Sea -->
  <path d="M470,220 L505,300" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
  <path d="M470,220 L505,300" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>

  <!-- Tropic of Cancer: dashed line across southern Egypt -->
  <line x1="110" y1="430" x2="560" y2="430" stroke="#b91c1c" stroke-width="5" stroke-dasharray="18 14"/>

  <!-- Numbered markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="240" cy="330" r="26" fill="#a16207" stroke="#ffffff" stroke-width="5"/>
    <text x="240" y="342" fill="#ffffff">1</text>
    <circle cx="300" cy="186" r="26" fill="#0369a1" stroke="#ffffff" stroke-width="5"/>
    <text x="300" y="198" fill="#ffffff">2</text>
    <circle cx="560" cy="420" r="26" fill="#0369a1" stroke="#ffffff" stroke-width="5"/>
    <text x="560" y="432" fill="#ffffff">3</text>
    <circle cx="488" cy="222" r="26" fill="#b45309" stroke="#ffffff" stroke-width="5"/>
    <text x="488" y="234" fill="#ffffff">4</text>
    <circle cx="170" cy="430" r="26" fill="#b91c1c" stroke="#ffffff" stroke-width="5"/>
    <text x="170" y="442" fill="#ffffff">5</text>
  </g>
</svg>
