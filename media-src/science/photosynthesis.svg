<?xml version="1.0" encoding="UTF-8"?>
<!--
  Photosynthesis — educational diagram for off_sci_u1_l1_plant_needs / c1.
  Text-free by design: numbered callouts are explained in localized HTML in the
  app, so no language is baked into the image (RTL rule). Numbers are never
  mirrored. Drawn to the Miss Noor palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,8 L5,0 L10,8 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="url(#sky)"/>

  <!-- Sun: light energy -->
  <g>
    <circle cx="120" cy="110" r="52" fill="url(#sun)"/>
    <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <line x1="120" y1="34" x2="120" y2="14"/>
      <line x1="120" y1="186" x2="120" y2="206"/>
      <line x1="44" y1="110" x2="24" y2="110"/>
      <line x1="196" y1="110" x2="216" y2="110"/>
      <line x1="66" y1="56" x2="52" y2="42"/>
      <line x1="174" y1="164" x2="188" y2="178"/>
      <line x1="174" y1="56" x2="188" y2="42"/>
      <line x1="66" y1="164" x2="52" y2="178"/>
    </g>
    <!-- light rays toward the leaf -->
    <g stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8" opacity="0.9">
      <line x1="190" y1="150" x2="430" y2="250"/>
      <line x1="196" y1="120" x2="470" y2="210"/>
      <line x1="188" y1="180" x2="400" y2="300"/>
    </g>
  </g>

  <!-- Plant -->
  <g>
    <!-- ground -->
    <rect x="0" y="470" width="960" height="130" fill="#a16207" opacity="0.18"/>
    <path d="M0,470 Q480,440 960,470 L960,600 L0,600 Z" fill="#78350f" opacity="0.25"/>
    <!-- roots -->
    <g stroke="#a16207" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M480,470 C470,510 430,520 400,540"/>
      <path d="M480,470 C490,510 530,520 560,540"/>
      <path d="M480,470 C480,520 480,540 480,560"/>
      <path d="M480,500 C450,530 440,545 420,570"/>
      <path d="M480,500 C510,530 520,545 540,570"/>
    </g>
    <!-- stem -->
    <path d="M480,470 L480,250" stroke="url(#stem)" stroke-width="22" stroke-linecap="round"/>
    <!-- leaves -->
    <g fill="url(#leaf)" stroke="#15803d" stroke-width="3">
      <path d="M480,300 C400,260 330,300 320,360 C400,380 470,360 480,300 Z"/>
      <path d="M480,300 C560,260 630,300 640,360 C560,380 490,360 480,300 Z"/>
      <path d="M480,230 C420,190 360,225 352,278 C418,296 472,272 480,230 Z"/>
      <path d="M480,230 C540,190 600,225 608,278 C542,296 488,272 480,230 Z"/>
    </g>
    <!-- leaf veins -->
    <g stroke="#166534" stroke-width="2.5" opacity="0.6" fill="none">
      <path d="M480,310 L340,355"/><path d="M480,310 L620,355"/>
      <path d="M480,240 L366,272"/><path d="M480,240 L594,272"/>
    </g>
  </g>

  <!-- Water uptake (roots) -->
  <g stroke="#0284c7" stroke-width="6" fill="none" marker-end="url(#arrowUp)">
    <line x1="330" y1="560" x2="330" y2="470"/>
    <line x1="640" y1="560" x2="640" y2="470"/>
  </g>

  <!-- CO2 in (stomata) -->
  <g stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrowUp)">
    <line x1="700" y1="210" x2="620" y2="250"/>
  </g>

  <!-- O2 out -->
  <g stroke="#dc2626" stroke-width="6" fill="none" marker-end="url(#arrowDown)">
    <line x1="250" y1="250" x2="180" y2="215"/>
  </g>

  <!-- Glucose produced (leaf) -->
  <g>
    <circle cx="480" cy="310" r="15" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- Numbered callouts -->
  <g font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">
    <g fill="#b45309"><circle cx="120" cy="110" r="0"/></g>
    <circle cx="120" cy="110" r="0" fill="none"/>
    <!-- 1 sun -->
    <circle cx="120" cy="110" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="120" y="120" fill="#615bff">1</text>
    <!-- 2 water -->
    <circle cx="330" cy="560" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="330" y="570" fill="#615bff">2</text>
    <!-- 3 CO2 -->
    <circle cx="700" cy="210" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="700" y="220" fill="#615bff">3</text>
    <!-- 4 chlorophyll / leaf factory -->
    <circle cx="480" cy="230" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="480" y="240" fill="#615bff">4</text>
    <!-- 5 glucose -->
    <circle cx="480" cy="310" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="480" y="320" fill="#615bff">5</text>
    <!-- 6 oxygen -->
    <circle cx="180" cy="215" r="26" fill="#fff" stroke="#615bff" stroke-width="4"/>
    <text x="180" y="225" fill="#615bff">6</text>
  </g>
</svg>
