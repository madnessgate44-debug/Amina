<?xml version="1.0" encoding="UTF-8"?>
<!--
  Equation vs expression and the variable — off_math_u2_l1.
  Text-free: five numbered callouts. 1 marks the balance (the equation 56 - x
  = 47,5); 2 the left pan, 3 the right pan; 4 the equals sign that makes it an
  equation; 5 the variable x, the unknown we solve for. A separate expression
  without an equals sign is shown greyed and crossed, so the child sees the
  difference. Wording lives in the catalog's localized legend/alt, so no script
  is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="eqBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#eqBg)"/>

  <!-- Balance beam -->
  <line x1="180" y1="200" x2="780" y2="200" stroke="#a5b4fc" stroke-width="14" stroke-linecap="round"/>
  <!-- Fulcrum -->
  <path d="M480,200 L440,340 L520,340 Z" fill="#4338ca" stroke="#818cf8" stroke-width="6"/>
  <line x1="400" y1="350" x2="560" y2="350" stroke="#818cf8" stroke-width="12" stroke-linecap="round"/>

  <!-- Left pan: the expression part 56 - x -->
  <g transform="translate(240,200)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#818cf8" stroke-width="6"/>
    <path d="M-90,90 L90,90 L70,150 L-70,150 Z" fill="#312e81" stroke="#818cf8" stroke-width="5"/>
    <text x="0" y="135" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#e0e7ff" text-anchor="middle">56 - x</text>
  </g>

  <!-- Right pan: the number 47,5 -->
  <g transform="translate(720,200)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#818cf8" stroke-width="6"/>
    <path d="M-90,90 L90,90 L70,150 L-70,150 Z" fill="#312e81" stroke="#818cf8" stroke-width="5"/>
    <text x="0" y="135" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#e0e7ff" text-anchor="middle">47,5</text>
  </g>

  <!-- The equals sign in the centre, highlighted -->
  <text x="480" y="150" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="bold" fill="#f59e0b" text-anchor="middle">=</text>

  <!-- Expression without "=", greyed and crossed: 56 - x -->
  <g transform="translate(480,480)" opacity="0.85">
    <rect x="-150" y="-44" width="300" height="88" rx="16" fill="#0f172a" stroke="#475569" stroke-width="5"/>
    <text x="0" y="16" font-family="DejaVu Sans, sans-serif" font-size="50" font-weight="bold" fill="#94a3b8" text-anchor="middle">56 - x</text>
    <line x1="-150" y1="-44" x2="150" y2="44" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="480" cy="80" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="480" y="92" fill="#4338ca">1</text>
    <circle cx="180" cy="330" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="180" y="342" fill="#4338ca">2</text>
    <circle cx="780" cy="330" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="780" y="342" fill="#4338ca">3</text>
    <circle cx="480" cy="160" r="26" fill="#ffffff" stroke="#a16207" stroke-width="5"/>
    <text x="480" y="172" fill="#a16207">4</text>
    <circle cx="620" cy="250" r="26" fill="#ffffff" stroke="#0e7490" stroke-width="5"/>
    <text x="620" y="262" fill="#0e7490">5</text>
  </g>
</svg>
