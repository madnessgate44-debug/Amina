<?xml version="1.0" encoding="UTF-8"?>
<!--
  Order of operations — off_math_u6_l1 (ترتيب العمليات الحسابية).
  Text-free: five numbered callouts. 1 marks the whole expression 2 + 3 × 4;
  2 the multiplication 3 × 4, which jumps ahead of the addition; 3 the addition
  2 + 12; 4 the second line after the multiplication is done; 5 the result 14.
  The layout shows 2 + 3 × 4 -> 2 + 12 -> 14, so the child sees that the
  multiplication is computed before the addition. Wording lives in the catalog's
  localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="orderBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="orderArrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#orderBg)"/>

  <!-- Row 1: the expression 2 + 3 × 4 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="120" font-weight="bold" text-anchor="middle">
    <text x="200" y="180" fill="#e0e7ff">2</text>
    <text x="330" y="180" fill="#94a3b8">+</text>
    <text x="460" y="180" fill="#e0e7ff">3</text>
    <text x="600" y="180" fill="#fbbf24">×</text>
    <text x="730" y="180" fill="#e0e7ff">4</text>
  </g>

  <!-- Highlight box around 3 × 4 (do this first) -->
  <rect x="530" y="60" width="290" height="160" rx="20" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="18 12"/>

  <!-- Arrow down -->
  <g fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round">
    <path d="M630,250 L630,320" marker-end="url(#orderArrow)"/>
  </g>

  <!-- Row 2: 2 + 12 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="120" font-weight="bold" text-anchor="middle">
    <text x="200" y="440" fill="#e0e7ff">2</text>
    <text x="330" y="440" fill="#94a3b8">+</text>
    <text x="460" y="440" fill="#6ee7b7">12</text>
  </g>

  <!-- Result box 14 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="120" font-weight="bold" text-anchor="middle">
    <circle cx="780" cy="410" r="80" fill="#065f46" opacity="0.55"/>
    <text x="780" y="452" fill="#6ee7b7">14</text>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="90" cy="110" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="90" y="122" fill="#4338ca">1</text>
    <circle cx="600" cy="40" r="26" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="600" y="52" fill="#b45309">2</text>
    <circle cx="330" cy="360" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="330" y="372" fill="#4338ca">3</text>
    <circle cx="120" cy="540" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="120" y="552" fill="#4338ca">4</text>
    <circle cx="900" cy="410" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="900" y="422" fill="#047857">5</text>
  </g>
</svg>
