<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prime factor tree — off_math_u2_l4 (شجرة العوامل الأولية).
  Text-free: five numbered callouts. 1 marks the starting number 24; 2 the first
  split into 2 and 12; 3 the split of 12 into 2 and 6; 4 the split of 6 into 2
  and 3; 5 the circled leaves, which are all prime numbers. Wording lives in the
  catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="treeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#treeBg)"/>

  <!-- Edges -->
  <g stroke="#818cf8" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M480,140 L340,260"/>
    <path d="M480,140 L660,260"/>
    <path d="M340,300 L240,420"/>
    <path d="M340,300 L430,420"/>
    <path d="M430,460 L360,540"/>
    <path d="M430,460 L520,540"/>
  </g>

  <!-- Nodes -->
  <g font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="bold" text-anchor="middle">
    <circle cx="480" cy="110" r="62" fill="#4338ca"/>
    <text x="480" y="135" fill="#ffffff">24</text>

    <circle cx="340" cy="290" r="56" fill="#4f46e5"/>
    <text x="340" y="312" fill="#ffffff">2</text>

    <circle cx="660" cy="290" r="56" fill="#4f46e5"/>
    <text x="660" y="312" fill="#ffffff">12</text>

    <circle cx="240" cy="450" r="56" fill="#4f46e5"/>
    <text x="240" y="472" fill="#ffffff">2</text>

    <circle cx="430" cy="450" r="56" fill="#4f46e5"/>
    <text x="430" y="472" fill="#ffffff">6</text>

    <!-- Prime leaves, highlighted -->
    <circle cx="360" cy="545" r="46" fill="#065f46" stroke="#34d399" stroke-width="5"/>
    <text x="360" y="563" fill="#6ee7b7" font-size="60">2</text>

    <circle cx="520" cy="545" r="46" fill="#065f46" stroke="#34d399" stroke-width="5"/>
    <text x="520" y="563" fill="#6ee7b7" font-size="60">3</text>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="480" cy="40" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="480" y="52" fill="#4338ca">1</text>
    <circle cx="600" cy="180" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="600" y="192" fill="#4338ca">2</text>
    <circle cx="700" cy="360" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="700" y="372" fill="#4338ca">3</text>
    <circle cx="470" cy="530" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="470" y="542" fill="#4338ca">4</text>
    <circle cx="628" cy="545" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="628" y="557" fill="#047857">5</text>
  </g>
</svg>
