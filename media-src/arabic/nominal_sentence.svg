<?xml version="1.0" encoding="UTF-8"?>
<!--
  The nominal sentence (المبتدأ والخبر) — off_ar_u1_l3_c1.
  Text-free schematic: two blocks joined by a bar (subject + predicate), then the
  three case-ending marks — ḍamma, alif, waw — as numbered callouts. Wording lives
  in the catalog's localized legend/alt HTML.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#gpaper)"/>

  <!-- The two sentence elements -->
  <rect x="120" y="110" width="230" height="120" rx="20" fill="#615bff" stroke="#3f38c9" stroke-width="6"/>
  <rect x="450" y="110" width="230" height="120" rx="20" fill="#26b8a8" stroke="#14857a" stroke-width="6"/>
  <!-- The bar joining them (the pair) -->
  <rect x="358" y="152" width="84" height="36" rx="10" fill="#ffb86b" stroke="#c97f27" stroke-width="5"/>

  <!-- Case-ending marks: a single ḍamma mark (a small loop) -->
  <g transform="translate(150,320)">
    <path d="M-16,10 q16,-30 32,0" fill="none" stroke="#17233b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="34" r="20" fill="#17233b"/>
  </g>
  <!-- alif: a tall vertical stroke -->
  <g transform="translate(400,320)">
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#17233b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="34" r="20" fill="#17233b"/>
  </g>
  <!-- waw: a small rounded hook -->
  <g transform="translate(650,320)">
    <path d="M-24,-24 q-6,44 26,44 q18,0 22,-16" fill="none" stroke="#17233b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="0" cy="34" r="20" fill="#17233b"/>
  </g>

  <!-- Numbered markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="200" cy="170" r="26" fill="#3f38c9" stroke="#ffffff" stroke-width="5"/>
    <text x="200" y="182" fill="#ffffff">1</text>
    <circle cx="600" cy="170" r="26" fill="#14857a" stroke="#ffffff" stroke-width="5"/>
    <text x="600" y="182" fill="#ffffff">2</text>
    <circle cx="150" cy="420" r="26" fill="#17233b" stroke="#ffffff" stroke-width="5"/>
    <text x="150" y="432" fill="#ffffff">3</text>
    <circle cx="400" cy="420" r="26" fill="#17233b" stroke="#ffffff" stroke-width="5"/>
    <text x="400" y="432" fill="#ffffff">4</text>
    <circle cx="650" cy="420" r="26" fill="#17233b" stroke="#ffffff" stroke-width="5"/>
    <text x="650" y="432" fill="#ffffff">5</text>
  </g>
</svg>
