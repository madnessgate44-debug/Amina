<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dr. Magdi Yacoub: giving back — off_ar_u3_l1_c1 (الانتماء الوطني وخدمة المجتمع).
  Text-free schematic: a heart (the surgeon's field), a hospital (the Aswan centre),
  a returning arrow (the journey home) and an open hand offering a heart (free care
  for children). Four numbered callouts; wording is localized in the catalog.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="hsand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#hsky)"/>
  <rect y="470" width="960" height="130" fill="url(#hsand)"/>

  <!-- 1: the heart — cardiac surgery, the surgeon's calling -->
  <g transform="translate(480,150)">
    <path d="M0,70 C-92,0 -80,-84 -28,-84 C-4,-84 0,-60 0,-48 C0,-60 4,-84 28,-84 C80,-84 92,0 0,70 Z"
          fill="#ef4444" stroke="#b91c1c" stroke-width="6"/>
    <path d="M-46,-24 h26 l14,-24 l16,46 l12,-22 h26" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2: the hospital (the Aswan heart centre) with its dome and cross -->
  <g transform="translate(190,340)">
    <rect x="-90" y="-60" width="180" height="170" rx="12" fill="#ffffff" stroke="#334155" stroke-width="6"/>
    <rect x="-70" y="-20" width="42" height="42" fill="#bae6fd" stroke="#334155" stroke-width="5"/>
    <rect x="28" y="-20" width="42" height="42" fill="#bae6fd" stroke="#334155" stroke-width="5"/>
    <rect x="-22" y="66" width="44" height="44" fill="#26b8a8" stroke="#334155" stroke-width="5"/>
    <path d="M-30,-60 q30,-46 60,0 Z" fill="#26b8a8" stroke="#14857a" stroke-width="6"/>
    <line x1="0" y1="-92" x2="0" y2="-124" stroke="#334155" stroke-width="6"/>
    <path d="M0,-136 v22 M-11,-125 h22" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 3: the return — a curved arrow from far away back to home -->
  <g transform="translate(720,300)">
    <path d="M-70,60 C-90,-40 60,-90 150,-20" fill="none" stroke="#615bff" stroke-width="12" stroke-linecap="round"/>
    <path d="M120,-52 L152,-20 L112,-6 Z" fill="#615bff"/>
  </g>

  <!-- 4: an open hand offering a heart — free care for children -->
  <g transform="translate(560,430)">
    <path d="M-60,40 q0,-40 30,-46 q6,-22 24,-16 q10,-16 26,-6 q18,-6 22,14 q26,6 22,40 q-2,18 -24,20 L-38,60 q-22,-2 -22,-20 Z"
          fill="#fcd34d" stroke="#b45309" stroke-width="6"/>
    <path d="M0,10 C-34,-24 -30,-52 -12,-52 C-4,-52 0,-44 0,-38 C0,-44 4,-52 12,-52 C30,-52 34,-24 0,10 Z"
          fill="#ef4444" stroke="#b91c1c" stroke-width="5"/>
  </g>

  <!-- Numbered markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="480" cy="60" r="26" fill="#b91c1c" stroke="#ffffff" stroke-width="5"/>
    <text x="480" y="72" fill="#ffffff">1</text>
    <circle cx="110" cy="470" r="26" fill="#14857a" stroke="#ffffff" stroke-width="5"/>
    <text x="110" y="482" fill="#ffffff">2</text>
    <circle cx="852" cy="252" r="26" fill="#3f38c9" stroke="#ffffff" stroke-width="5"/>
    <text x="852" y="264" fill="#ffffff">3</text>
    <circle cx="686" cy="470" r="26" fill="#b45309" stroke="#ffffff" stroke-width="5"/>
    <text x="686" y="482" fill="#ffffff">4</text>
  </g>
</svg>
