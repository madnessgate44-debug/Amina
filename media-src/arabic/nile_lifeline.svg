<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Nile as Egypt's lifeline — off_ar_u1_l2_c1 (قدسية النيل وواجب الترشيد الوطني).
  Text-free schematic: five numbered callouts (the river artery, the ancient oath,
  irrigated farmland, a closed tap for conservation, a blocked waste barrel for
  pollution). Wording lives in the catalog's localized legend/alt HTML.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ndesert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d79b"/>
      <stop offset="1" stop-color="#e0b46a"/>
    </linearGradient>
    <linearGradient id="nriver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="nfarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#nsky)"/>
  <rect y="300" width="960" height="300" fill="url(#ndesert)"/>

  <!-- The river artery winding through the desert -->
  <path d="M0,470 C220,430 300,500 470,455 C640,410 760,470 960,420 L960,540 C760,570 640,520 470,555 C300,590 220,520 0,560 Z"
        fill="url(#nriver)"/>

  <!-- Green farmland strip hugging the river (irrigated land) -->
  <path d="M0,452 C220,412 300,482 470,437 C640,392 760,452 960,402 L960,432 C760,482 640,422 470,467 C300,512 220,442 0,482 Z"
        fill="url(#nfarm)"/>

  <!-- Small date palms along the bank -->
  <g stroke="#166534" stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="430" x2="150" y2="380"/>
    <line x1="700" y1="405" x2="700" y2="355"/>
  </g>
  <g fill="#15803d">
    <path d="M150,380 q-34,-22 -60,-10 q26,20 60,10 Z"/>
    <path d="M150,380 q34,-22 60,-10 q-26,20 -60,10 Z"/>
    <path d="M150,380 q-14,-34 -6,-58 q18,26 6,58 Z"/>
    <path d="M700,355 q-30,-20 -54,-9 q24,18 54,9 Z"/>
    <path d="M700,355 q30,-20 54,-9 q-24,18 -54,9 Z"/>
  </g>

  <!-- 2: the ancient oath — an open papyrus scroll held up -->
  <g transform="translate(360,120)">
    <path d="M-70,0 q-18,20 0,40 L0,40 L70,40 q18,-20 0,-40 Z" fill="#fef9c3" stroke="#a16207" stroke-width="5"/>
    <path d="M-70,0 q-18,-20 0,-40 L0,-40 L70,-40 q18,20 0,40 Z" fill="#fefce8" stroke="#a16207" stroke-width="5"/>
    <line x1="-34" y1="18" x2="34" y2="18" stroke="#a16207" stroke-width="4"/>
    <line x1="-34" y1="-18" x2="34" y2="-18" stroke="#a16207" stroke-width="4"/>
  </g>

  <!-- 4: a closed tap — conservation (turned off, a drop held back) -->
  <g transform="translate(820,250)">
    <rect x="-18" y="-18" width="36" height="44" rx="8" fill="#64748b" stroke="#334155" stroke-width="5"/>
    <rect x="-52" y="-10" width="34" height="16" rx="8" fill="#94a3b8" stroke="#334155" stroke-width="5"/>
    <path d="M-60,-18 l-26,-16" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M18,0 q22,0 22,22" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 5: a waste barrel crossed out — no pollution -->
  <g transform="translate(560,470)">
    <rect x="-34" y="-30" width="68" height="72" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
    <line x1="-34" y1="-4" x2="34" y2="-4" stroke="#b45309" stroke-width="5"/>
    <line x1="-30" y1="-52" x2="30" y2="-52" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="58" fill="none" stroke="#dc2626" stroke-width="10"/>
    <line x1="-41" y1="-35" x2="41" y2="47" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Numbered markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="230" cy="500" r="26" fill="#0369a1" stroke="#ffffff" stroke-width="5"/>
    <text x="230" y="512" fill="#ffffff">1</text>
    <circle cx="360" cy="80" r="26" fill="#a16207" stroke="#ffffff" stroke-width="5"/>
    <text x="360" y="92" fill="#ffffff">2</text>
    <circle cx="330" cy="470" r="26" fill="#15803d" stroke="#ffffff" stroke-width="5"/>
    <text x="330" y="482" fill="#ffffff">3</text>
    <circle cx="820" cy="185" r="26" fill="#334155" stroke="#ffffff" stroke-width="5"/>
    <text x="820" y="197" fill="#ffffff">4</text>
    <circle cx="646" cy="500" r="26" fill="#b91c1c" stroke="#ffffff" stroke-width="5"/>
    <text x="646" y="512" fill="#ffffff">5</text>
  </g>
</svg>
