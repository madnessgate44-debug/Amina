# Keeps the deployed Miss Noor app warm.
#
# Free Spaces sleep after a period of inactivity, so the first click can take
# 30-60s. This pings the health endpoint every 10 minutes to reduce that.
#
# Set the repository variable APP_URL to the deployed base URL, e.g.
#   gh variable set APP_URL --body "https://<username>-miss-noor.hf.space"
# If APP_URL is unset the job exits cleanly (it does not fail CI).
#
# Note: GitHub disables scheduled workflows in repos with no activity for 60
# days; the owner can re-enable from the Actions tab.
name: Keep app warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set; skipping warm ping."
            exit 0
          fi
          echo "Pinging $APP_URL/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$APP_URL/api/health" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 20
          done
          echo "Health endpoint did not return 200 after 3 attempts."
          exit 1
