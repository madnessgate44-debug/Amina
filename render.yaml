# Render blueprint for Amina — AI School Companion.
#
# Deploy: push this file, then in Render choose "New > Blueprint" and point it
# at this repository. The app gets a permanent https URL.
#
# Set GEMINI_API_KEY in the Render dashboard (Environment). Without it the app
# still runs, but the AI routes return truthful degraded fallbacks.

services:
  - type: web
    name: amina
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
