# Render blueprint for Amina — AI School Companion.
#
# Deploy: push this file, then in Render choose "New > Blueprint" and point it
# at this repository. The app gets a permanent https URL.
#
# Set GEMINI_API_KEY in the Render dashboard (Environment). Without it the app
# still runs, but the AI routes return truthful degraded fallbacks.
#
# npm start sets NODE_ENV=production itself, so no NODE_ENV env var is needed.
# ALLOWED_ORIGINS is not read by server.ts yet, so it is not listed.
# Free plans may sleep when idle, so the first load can be slow; owner to verify current Render policy.

services:
  - type: web
    name: amina
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev: the build needs tailwindcss and the start script needs tsx (both devDependencies).
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
