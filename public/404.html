<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Amina — AI School Companion</title>
    <script>
      // Static hosts (GitHub Pages) have no SPA rewrite. Preserve the deep link
      // and hand it to the app shell.
      var path = location.pathname + location.search + location.hash;
      location.replace('/' + (path.indexOf('/') === 0 ? path.slice(1) : path));
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p>Redirecting to <a href="/">Amina</a>…</p>
  </body>
</html>
