<?xml version="1.0" encoding="UTF-8"?>
<!--
  Computer accessories and their functions — off_ict_u1_l1 (ملحقات الحاسب الآلي).
  Text-free: five numbered callouts (the router, the Ethernet cable, the flash
  memory, the HDMI cable, and the external hard drive for backup). Wording
  lives in the catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="ictBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#ictBg)"/>

  <!-- Central laptop -->
  <g transform="translate(480,300)">
    <rect x="-140" y="-90" width="280" height="170" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
    <rect x="-120" y="-70" width="240" height="130" rx="8" fill="#0ea5e9" opacity="0.25"/>
    <path d="M-180,90 L180,90 L200,120 L-200,120 Z" fill="#334155" stroke="#38bdf8" stroke-width="5"/>
  </g>

  <!-- 1 Router (top left) with wifi arcs -->
  <g transform="translate(140,140)">
    <rect x="-70" y="-6" width="140" height="52" rx="12" fill="#1f2937" stroke="#22d3ee" stroke-width="5"/>
    <line x1="-40" y1="-6" x2="-52" y2="-58" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <line x1="40" y1="-6" x2="52" y2="-58" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round">
      <path d="M-24,-70 C-8,-86 8,-86 24,-70"/>
      <path d="M-44,-92 C-16,-118 16,-118 44,-92"/>
    </g>
  </g>

  <!-- 2 Ethernet cable (left, to laptop) -->
  <g transform="translate(150,380)">
    <path d="M0,0 C60,10 120,-30 200,-20" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>
    <rect x="-26" y="-16" width="30" height="32" rx="5" fill="#eab308" stroke="#a16207" stroke-width="4"/>
  </g>

  <!-- 3 Flash memory / USB stick (top right) -->
  <g transform="translate(820,150)">
    <rect x="-50" y="-22" width="80" height="44" rx="8" fill="#f87171" stroke="#b91c1c" stroke-width="5"/>
    <rect x="30" y="-10" width="34" height="20" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- 4 HDMI cable (right, to laptop) -->
  <g transform="translate(820,360)">
    <path d="M0,0 C-60,10 -120,-30 -200,-20" fill="none" stroke="#a78bfa" stroke-width="12" stroke-linecap="round"/>
    <rect x="-4" y="-16" width="32" height="32" rx="5" fill="#8b5cf6" stroke="#5b21b6" stroke-width="4"/>
  </g>

  <!-- 5 External hard drive (bottom) -->
  <g transform="translate(480,530)">
    <rect x="-90" y="-32" width="180" height="64" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="52" cy="0" r="12" fill="#22d3ee"/>
    <rect x="-66" y="-8" width="80" height="16" rx="4" fill="#1e293b"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="140" cy="240" r="26" fill="#ffffff" stroke="#0e7490" stroke-width="5"/>
    <text x="140" y="252" fill="#0e7490">1</text>
    <circle cx="150" cy="380" r="26" fill="#ffffff" stroke="#a16207" stroke-width="5"/>
    <text x="150" y="392" fill="#a16207">2</text>
    <circle cx="820" cy="240" r="26" fill="#ffffff" stroke="#b91c1c" stroke-width="5"/>
    <text x="820" y="252" fill="#b91c1c">3</text>
    <circle cx="820" cy="360" r="26" fill="#ffffff" stroke="#5b21b6" stroke-width="5"/>
    <text x="820" y="372" fill="#5b21b6">4</text>
    <circle cx="480" cy="530" r="26" fill="#ffffff" stroke="#475569" stroke-width="5"/>
    <text x="480" y="542" fill="#475569">5</text>
  </g>
</svg>
