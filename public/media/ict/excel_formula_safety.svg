<?xml version="1.0" encoding="UTF-8"?>
<!--
  Excel formulas and safe sharing — off_ict_u1_l6 (صيغ إكسل وقواعد المشاركة الآمنة).
  Text-free: five numbered callouts. 1 the spreadsheet grid with its cell
  references; 2 the formula bar, where every formula starts with the equals
  sign; 3 the sum formula over two cells; 4 the safe private network for
  school work; 5 the open network, where personal data must never be posted.
  Wording lives in the catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="xlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#xlBg)"/>

  <!-- Spreadsheet window -->
  <rect x="70" y="90" width="500" height="420" rx="20" fill="#0b3b2e" stroke="#34d399" stroke-width="5"/>
  <!-- Formula bar -->
  <rect x="96" y="118" width="448" height="56" rx="10" fill="#064e3b" stroke="#6ee7b7" stroke-width="3"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#a7f3d0">
    <text x="120" y="158">=</text>
  </g>
  <rect x="156" y="132" width="70" height="28" rx="6" fill="#10b981" opacity="0.55"/>
  <rect x="238" y="132" width="70" height="28" rx="6" fill="#10b981" opacity="0.55"/>

  <!-- Grid -->
  <g stroke="#065f46" stroke-width="3">
    <line x1="96" y1="206" x2="544" y2="206"/>
    <line x1="96" y1="286" x2="544" y2="286"/>
    <line x1="96" y1="366" x2="544" y2="366"/>
    <line x1="96" y1="446" x2="544" y2="446"/>
    <line x1="96" y1="196" x2="96" y2="486"/>
    <line x1="246" y1="196" x2="246" y2="486"/>
    <line x1="396" y1="196" x2="396" y2="486"/>
    <line x1="544" y1="196" x2="544" y2="486"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#d1fae5">
    <text x="171" y="256">5</text>
    <text x="321" y="256">8</text>
    <text x="470" y="256">13</text>
  </g>
  <!-- Sum result cell highlighted -->
  <rect x="396" y="286" width="148" height="80" fill="#fde047" opacity="0.30"/>

  <!-- Safe private network (left icon) -->
  <g transform="translate(660,180)">
    <rect x="0" y="0" width="220" height="150" rx="20" fill="#1e3a8a" opacity="0.55" stroke="#93c5fd" stroke-width="5"/>
    <circle cx="110" cy="70" r="30" fill="#60a5fa"/>
    <g stroke="#bfdbfe" stroke-width="5" stroke-linecap="round">
      <line x1="110" y1="40" x2="110" y2="20"/>
      <line x1="80" y1="70" x2="60" y2="70"/>
      <line x1="140" y1="70" x2="160" y2="70"/>
      <line x1="110" y1="100" x2="110" y2="120"/>
    </g>
  </g>

  <!-- Open network (right icon) with a warning cross -->
  <g transform="translate(660,380)">
    <rect x="0" y="0" width="220" height="150" rx="20" fill="#7c2d12" opacity="0.5" stroke="#fb923c" stroke-width="5"/>
    <circle cx="110" cy="75" r="42" fill="none" stroke="#fdba74" stroke-width="6"/>
    <path d="M80,45 L140,105 M140,45 L80,105" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="470" cy="230" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="470" y="242" fill="#047857">1</text>
    <circle cx="70" cy="146" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="70" y="158" fill="#047857">2</text>
    <circle cx="610" cy="326" r="26" fill="#ffffff" stroke="#ca8a04" stroke-width="5"/>
    <text x="610" y="338" fill="#a16207">3</text>
    <circle cx="640" cy="120" r="26" fill="#ffffff" stroke="#1d4ed8" stroke-width="5"/>
    <text x="640" y="132" fill="#1d4ed8">4</text>
    <circle cx="640" cy="560" r="26" fill="#ffffff" stroke="#c2410c" stroke-width="5"/>
    <text x="640" y="572" fill="#c2410c">5</text>
  </g>
</svg>
