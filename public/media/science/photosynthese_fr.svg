<?xml version="1.0" encoding="UTF-8"?>
<!--
  Photosynthesis and the plant's vessels — off_scifr_u1_l1_plantes
  (البناء الضوئي وأوعية النبات).
  Text-free: six numbered callouts. 1 the sun (light energy); 2 the roots
  taking up water and mineral salts; 3 the xylem vessels carrying water up to
  the leaves; 4 the leaf, where the stomata take in CO2 and the chlorophyll
  captures the light; 5 the glucose and dioxygen produced; 6 the phloem
  vessels distributing the glucose to the whole plant. Wording lives in the
  catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="photoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="url(#photoBg)"/>

  <!-- Sun -->
  <g>
    <g stroke="#fbbf24" stroke-width="8" stroke-linecap="round">
      <line x1="150" y1="60" x2="150" y2="90"/>
      <line x1="90" y1="110" x2="60" y2="110"/>
      <line x1="100" y1="70" x2="80" y2="50"/>
      <line x1="200" y1="70" x2="220" y2="50"/>
    </g>
    <circle cx="150" cy="110" r="52" fill="url(#sunGlow)"/>
  </g>

  <!-- Soil line -->
  <path d="M0,470 Q240,455 480,470 T960,470 L960,600 L0,600 Z" fill="#3f2d1b" opacity="0.55"/>

  <!-- Root system -->
  <g stroke="#c084fc" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M150,470 L150,540"/>
    <path d="M150,500 L100,545"/>
    <path d="M150,510 L200,550"/>
    <path d="M150,470 L150,430"/>
  </g>

  <!-- Stem with xylem (up) and phloem (down) -->
  <g stroke="#4ade80" stroke-width="14" stroke-linecap="round">
    <line x1="150" y1="430" x2="150" y2="250"/>
  </g>
  <line x1="140" y1="420" x2="140" y2="268" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="268" x2="162" y2="420" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>

  <!-- Leaf blade with midrib -->
  <path d="M150,250 Q480,110 850,210 Q480,360 150,250 Z" fill="#22c55e"/>
  <path d="M150,250 Q500,250 850,210" stroke="#15803d" stroke-width="5" fill="none"/>

  <!-- CO2 into the leaf -->
  <g stroke="#93c5fd" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M300,120 L400,180"/>
  </g>

  <!-- Products leaving -->
  <g stroke="#facc15" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M700,300 L800,360"/>
  </g>
  <g stroke="#67e8f9" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M720,170 L830,120"/>
  </g>

  <!-- Phloem distributing down -->
  <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="2 14">
    <path d="M520,300 Q560,420 640,470"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="150" cy="30" r="26" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <text x="150" y="42" fill="#b45309">1</text>
    <circle cx="96" cy="556" r="26" fill="#ffffff" stroke="#7c3aed" stroke-width="5"/>
    <text x="96" y="568" fill="#6d28d9">2</text>
    <circle cx="252" cy="392" r="26" fill="#ffffff" stroke="#0891b2" stroke-width="5"/>
    <text x="252" y="404" fill="#0e7490">3</text>
    <circle cx="480" cy="150" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
    <text x="480" y="162" fill="#15803d">4</text>
    <circle cx="812" cy="376" r="26" fill="#ffffff" stroke="#ca8a04" stroke-width="5"/>
    <text x="812" y="388" fill="#a16207">5</text>
    <circle cx="656" cy="486" r="26" fill="#ffffff" stroke="#ca8a04" stroke-width="5"/>
    <text x="656" y="498" fill="#a16207">6</text>
  </g>
</svg>
