<?xml version="1.0" encoding="UTF-8"?>
<!--
  Coral bleaching — off_sci_u1_l3 (ابيضاض الشعاب المرجانية).
  Text-free: four numbered callouts (warm water, the reef turning white, the
  algae leaving, marine life losing its home). Wording lives in the catalog's
  localized legend/alt HTML.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#sea)"/>
  <!-- Sea floor -->
  <rect y="500" width="960" height="100" fill="#7c5c2b"/>

  <!-- Warm water: sun + heat rays at top -->
  <circle cx="820" cy="80" r="48" fill="#fde047"/>
  <g stroke="#fde047" stroke-width="9" stroke-linecap="round">
    <line x1="820" y1="10" x2="820" y2="-6"/>
    <line x1="890" y1="80" x2="916" y2="80"/>
    <line x1="870" y1="30" x2="888" y2="12"/>
  </g>
  <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="760" y1="150" x2="760" y2="240"/>
    <line x1="820" y1="150" x2="820" y2="240"/>
    <line x1="880" y1="150" x2="880" y2="240"/>
  </g>

  <!-- Healthy coral (left, coloured) with algae dots -->
  <g transform="translate(180,430)">
    <path d="M0,90 C-40,40 -20,-30 0,-40 C20,-30 40,40 0,90 Z" fill="#f472b6" stroke="#be185d" stroke-width="5"/>
    <path d="M-56,90 C-84,50 -70,0 -54,-8 C-38,0 -28,50 -56,90 Z" fill="#fb923c" stroke="#c2410c" stroke-width="5"/>
    <path d="M56,90 C84,50 70,0 54,-8 C38,0 28,50 56,90 Z" fill="#fb923c" stroke="#c2410c" stroke-width="5"/>
    <g fill="#a3e635">
      <circle cx="0" cy="-6" r="7"/><circle cx="-52" cy="24" r="7"/><circle cx="52" cy="24" r="7"/>
    </g>
  </g>

  <!-- Bleached coral (right, white) -->
  <g transform="translate(700,430)">
    <path d="M0,90 C-40,40 -20,-30 0,-40 C20,-30 40,40 0,90 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="5"/>
    <path d="M-56,90 C-84,50 -70,0 -54,-8 C-38,0 -28,50 -56,90 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="5"/>
    <path d="M56,90 C84,50 70,0 54,-8 C38,0 28,50 56,90 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="5"/>
  </g>

  <!-- Algae leaving the bleached coral (small drifting dots) -->
  <g fill="#a3e635">
    <circle cx="640" cy="360" r="7"/><circle cx="668" cy="330" r="6"/><circle cx="700" cy="300" r="6"/>
    <circle cx="736" cy="330" r="6"/><circle cx="768" cy="360" r="7"/>
  </g>

  <!-- Fish losing its home (near bleached coral) -->
  <g transform="translate(560,300)">
    <path d="M0,0 C30,-26 76,-26 96,0 C76,26 30,26 0,0 Z" fill="#facc15" stroke="#a16207" stroke-width="5"/>
    <path d="M0,0 L-30,-20 L-30,20 Z" fill="#facc15" stroke="#a16207" stroke-width="5"/>
    <circle cx="72" cy="-4" r="5" fill="#1c1917"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="820" cy="200" r="26" fill="#ffffff" stroke="#0c4a6e" stroke-width="5"/>
    <text x="820" y="212" fill="#0c4a6e">1</text>
    <circle cx="700" cy="430" r="26" fill="#ffffff" stroke="#0c4a6e" stroke-width="5"/>
    <text x="700" y="442" fill="#0c4a6e">2</text>
    <circle cx="688" cy="300" r="26" fill="#ffffff" stroke="#0c4a6e" stroke-width="5"/>
    <text x="688" y="312" fill="#0c4a6e">3</text>
    <circle cx="560" cy="300" r="26" fill="#ffffff" stroke="#0c4a6e" stroke-width="5"/>
    <text x="560" y="312" fill="#0c4a6e">4</text>
  </g>
</svg>
