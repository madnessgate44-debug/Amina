<?xml version="1.0" encoding="UTF-8"?>
<!--
  Solar energy cycle in nature — off_sci_u1_l2 (دورة الطاقة المستمرة).
  Text-free: six numbered callouts (the sun, the green plant that makes food,
  the herbivore that eats it, the carnivore that eats the herbivore, the
  decomposers in the soil, and the nutrients returning to the soil). Wording
  lives in the catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#sky)"/>
  <!-- Ground / soil -->
  <rect y="440" width="960" height="160" fill="#a16207"/>
  <rect y="440" width="960" height="26" fill="#65a30d"/>

  <!-- 1 Sun with rays (energy source) -->
  <g transform="translate(120,110)">
    <circle cx="0" cy="0" r="52" fill="#fde047" stroke="#eab308" stroke-width="6"/>
    <g stroke="#f59e0b" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-72" x2="0" y2="-96"/>
      <line x1="0" y1="72" x2="0" y2="96"/>
      <line x1="-72" y1="0" x2="-96" y2="0"/>
      <line x1="72" y1="0" x2="96" y2="0"/>
      <line x1="-52" y1="-52" x2="-70" y2="-70"/>
      <line x1="52" y1="-52" x2="70" y2="-70"/>
    </g>
  </g>

  <!-- 2 Green plant (producer) -->
  <g transform="translate(300,400)">
    <path d="M0,40 L0,-40" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
    <path d="M0,-10 C-52,-24 -64,-64 -30,-84 C-6,-64 -6,-30 0,-10 Z" fill="#22c55e" stroke="#15803d" stroke-width="5"/>
    <path d="M0,-10 C52,-24 64,-64 30,-84 C6,-64 6,-30 0,-10 Z" fill="#4ade80" stroke="#15803d" stroke-width="5"/>
  </g>

  <!-- 3 Herbivore (snail) -->
  <g transform="translate(470,430)">
    <path d="M-40,20 C-40,-6 -14,-6 -14,20 Z" fill="#f97316" stroke="#c2410c" stroke-width="5"/>
    <path d="M14,20 C14,-40 74,-40 74,0 C74,24 44,24 14,20 Z" fill="#fb923c" stroke="#c2410c" stroke-width="5"/>
    <circle cx="86" cy="-2" r="6" fill="#7c2d12"/>
  </g>

  <!-- 4 Carnivore (bird) -->
  <g transform="translate(690,360)">
    <path d="M0,0 C26,-30 82,-30 104,0 C82,26 26,26 0,0 Z" fill="#334155" stroke="#0f172a" stroke-width="5"/>
    <path d="M0,0 L-34,-22 L-34,22 Z" fill="#334155" stroke="#0f172a" stroke-width="5"/>
    <circle cx="78" cy="-4" r="5" fill="#f8fafc"/>
    <path d="M104,0 L126,-8 L126,8 Z" fill="#f59e0b"/>
  </g>

  <!-- 5 Decomposers in the soil (fungi + bacteria dots) -->
  <g transform="translate(430,520)">
    <path d="M0,0 C-30,0 -30,-34 0,-34 C30,-34 30,0 0,0 Z" fill="#f5f5f4" stroke="#78716c" stroke-width="5"/>
    <rect x="-7" y="0" width="14" height="26" fill="#e7e5e4" stroke="#78716c" stroke-width="4"/>
    <g fill="#a3e635">
      <circle cx="70" cy="-6" r="8"/><circle cx="98" cy="8" r="7"/><circle cx="120" cy="-10" r="7"/><circle cx="146" cy="6" r="8"/>
    </g>
  </g>

  <!-- 6 Nutrients returning to the soil (curved arrow to the plant roots) -->
  <g fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round">
    <path d="M300,540 C240,560 180,560 150,520" marker-end="url(#arrowHead)"/>
  </g>
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="120" cy="110" r="26" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="120" y="122" fill="#b45309">1</text>
    <circle cx="300" cy="300" r="26" fill="#ffffff" stroke="#15803d" stroke-width="5"/>
    <text x="300" y="312" fill="#15803d">2</text>
    <circle cx="470" cy="380" r="26" fill="#ffffff" stroke="#c2410c" stroke-width="5"/>
    <text x="470" y="392" fill="#c2410c">3</text>
    <circle cx="690" cy="300" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <text x="690" y="312" fill="#0f172a">4</text>
    <circle cx="430" cy="470" r="26" fill="#ffffff" stroke="#78716c" stroke-width="5"/>
    <text x="430" y="482" fill="#78716c">5</text>
    <circle cx="150" cy="520" r="26" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="150" y="532" fill="#b45309">6</text>
  </g>
</svg>
