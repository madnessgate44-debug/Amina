<?xml version="1.0" encoding="UTF-8"?>
<!--
  Standard column multiplication steps — off_math_u3_l3 (خطوات الضرب المعياري).
  Text-free: five numbered callouts. 1 marks the first partial product (76 × 4),
  2 the carried digit, 3 the zero placeholder on the second line, 4 the second
  partial product (76 × 2 tens), and 5 the final sum. The layout is the worked
  example 76 × 24 = 1824, so the child sees the order right-to-left and the
  added products. Wording lives in the catalog's localized legend/alt, so no
  script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="cmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#cmBg)"/>

  <!-- Column lines -->
  <g stroke="#818cf8" stroke-width="3" opacity="0.5">
    <line x1="220" y1="80" x2="220" y2="500"/>
    <line x1="360" y1="80" x2="360" y2="500"/>
    <line x1="500" y1="80" x2="500" y2="500"/>
    <line x1="640" y1="80" x2="640" y2="500"/>
  </g>

  <!-- Row 1: 76 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="80" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
    <text x="290" y="150">7</text>
    <text x="430" y="150">6</text>
  </g>
  <!-- Row 2: ×24 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="80" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
    <text x="150" y="240">×</text>
    <text x="290" y="240">2</text>
    <text x="430" y="240">4</text>
  </g>
  <!-- Divider -->
  <line x1="80" y1="270" x2="720" y2="270" stroke="#a5b4fc" stroke-width="6"/>

  <!-- Partial product 1: 304 (76×4) with carry 2 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="70" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
    <text x="290" y="345">3</text>
    <text x="430" y="345">0</text>
    <text x="570" y="345">4</text>
  </g>
  <!-- Carry digit -->
  <text x="360" y="300" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#f59e0b" text-anchor="middle">2</text>

  <!-- Partial product 2: 152 (76×2 tens) with zero placeholder -->
  <g font-family="DejaVu Sans, sans-serif" font-size="70" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
    <text x="150" y="430">1</text>
    <text x="290" y="430">5</text>
    <text x="430" y="430">2</text>
    <text x="570" y="430" fill="#22d3ee">0</text>
  </g>

  <line x1="80" y1="455" x2="720" y2="455" stroke="#a5b4fc" stroke-width="6"/>

  <!-- Final sum: 1824 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="80" font-weight="bold" fill="#4ade80" text-anchor="middle">
    <text x="150" y="540">1</text>
    <text x="290" y="540">8</text>
    <text x="430" y="540">2</text>
    <text x="570" y="540">4</text>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="820" cy="320" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="820" y="332" fill="#4338ca">1</text>
    <circle cx="360" cy="290" r="26" fill="#ffffff" stroke="#a16207" stroke-width="5"/>
    <text x="360" y="302" fill="#a16207">2</text>
    <circle cx="720" cy="430" r="26" fill="#ffffff" stroke="#0e7490" stroke-width="5"/>
    <text x="720" y="442" fill="#0e7490">3</text>
    <circle cx="820" cy="430" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="820" y="442" fill="#4338ca">4</text>
    <circle cx="820" cy="540" r="26" fill="#ffffff" stroke="#15803d" stroke-width="5"/>
    <text x="820" y="552" fill="#15803d">5</text>
  </g>
</svg>
