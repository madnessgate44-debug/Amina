<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rounding decimals — off_math_u1_l5 (تقريب الأعداد العشرية).
  Text-free: five numbered callouts. 1 marks the decimal number 7,7; 2 the units
  digit; 3 the digit to its right (7, which is 5 or more, so we round up); 4 the
  rounded result 8; 5 the number line, which shows 7,7 sitting nearer to 8 than
  to 7. Wording lives in the catalog's localized legend/alt, so no script is
  baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="roundBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="roundArrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#roundBg)"/>

  <!-- The number 7,7 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="150" font-weight="bold" text-anchor="middle">
    <text x="190" y="270" fill="#e0e7ff">7</text>
    <text x="285" y="270" fill="#f87171">,</text>
    <text x="375" y="270" fill="#fbbf24">7</text>
  </g>

  <!-- Arrow to the rounded result -->
  <g fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round">
    <path d="M490,230 C580,230 620,260 670,300" marker-end="url(#roundArrow)"/>
  </g>

  <!-- The rounded result 8 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="150" font-weight="bold" text-anchor="middle">
    <circle cx="770" cy="290" r="95" fill="#065f46" opacity="0.55"/>
    <text x="770" y="340" fill="#6ee7b7">8</text>
  </g>

  <!-- Number line from 7 to 8 with the midpoint 7,5 -->
  <line x1="150" y1="500" x2="830" y2="500" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#818cf8" stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="480" x2="150" y2="520"/>
    <line x1="490" y1="480" x2="490" y2="520"/>
    <line x1="830" y1="480" x2="830" y2="520"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#c7d2fe">
    <text x="150" y="570">7</text>
    <text x="490" y="570">7,5</text>
    <text x="830" y="570">8</text>
  </g>
  <!-- The mark for 7,7 sits right of the midpoint, nearer to 8 -->
  <circle cx="626" cy="500" r="18" fill="#fbbf24" stroke="#0f172a" stroke-width="5"/>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="80" cy="150" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="80" y="162" fill="#4338ca">1</text>
    <circle cx="190" cy="120" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="190" y="132" fill="#4338ca">2</text>
    <circle cx="375" cy="120" r="26" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="375" y="132" fill="#b45309">3</text>
    <circle cx="905" cy="230" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="905" y="242" fill="#047857">4</text>
    <circle cx="626" cy="410" r="26" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="626" y="422" fill="#b45309">5</text>
  </g>
</svg>
