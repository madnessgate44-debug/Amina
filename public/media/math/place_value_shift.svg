<?xml version="1.0" encoding="UTF-8"?>
<!--
  Place-value shift with 10 — off_math_u1_l2 (تأثير الضرب والقسمة على منزلة الرقم).
  Text-free: five numbered callouts. 1 marks the number 6,5; 2 the digit 6
  (units); 3 the digit 5 (tenths); 4 the ×10 arrow that moves every digit one
  place to the left; 5 the ÷10 arrow that moves every digit one place to the
  right. The layout shows 6,5 → 65 under ×10, so the child sees that multiplying
  by ten moves the comma one place right and makes the number bigger. Wording
  lives in the catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="mathBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="mArrow" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#mathBg)"/>

  <!-- Top row: the number 6,5 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="110" font-weight="bold" text-anchor="middle">
    <text x="360" y="200" fill="#e0e7ff">6</text>
    <text x="440" y="200" fill="#f87171">,</text>
    <text x="520" y="200" fill="#e0e7ff">5</text>
  </g>

  <!-- Middle: ×10 arrow moving left -->
  <g fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round">
    <path d="M520,260 C400,260 340,320 300,380" marker-end="url(#mArrow)"/>
  </g>
  <text x="300" y="270" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#22d3ee">×10</text>

  <!-- Bottom row: the result 65 with a decimal point shown as 65,0 -->
  <g font-family="DejaVu Sans, sans-serif" font-size="110" font-weight="bold" text-anchor="middle">
    <text x="380" y="500" fill="#e0e7ff">6</text>
    <text x="470" y="500" fill="#e0e7ff">5</text>
    <text x="545" y="500" fill="#94a3b8" opacity="0.7">,0</text>
  </g>

  <!-- ÷10 arrow moving right, back to 6,5 -->
  <g fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round">
    <path d="M700,470 C780,440 800,380 800,300" marker-end="url(#mArrow)"/>
  </g>
  <text x="760" y="410" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#f59e0b">÷10</text>

  <!-- Place-value grid behind the top number: units and tenths columns -->
  <g stroke-width="4" opacity="0.5">
    <rect x="300" y="100" width="120" height="130" rx="14" fill="#ffffff" opacity="0.06" stroke="#818cf8"/>
    <rect x="460" y="100" width="120" height="130" rx="14" fill="#ffffff" opacity="0.06" stroke="#818cf8"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="360" cy="70" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="360" y="82" fill="#4338ca">2</text>
    <circle cx="520" cy="70" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="520" y="82" fill="#4338ca">3</text>
    <circle cx="120" cy="200" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="120" y="212" fill="#4338ca">1</text>
    <circle cx="300" cy="380" r="26" fill="#ffffff" stroke="#0e7490" stroke-width="5"/>
    <text x="300" y="392" fill="#0e7490">4</text>
    <circle cx="800" cy="300" r="26" fill="#ffffff" stroke="#a16207" stroke-width="5"/>
    <text x="800" y="312" fill="#a16207">5</text>
  </g>
</svg>
