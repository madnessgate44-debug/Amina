<?xml version="1.0" encoding="UTF-8"?>
<!--
  Comparing decimals on a number line — off_math_u1_l4 (مقارنة الأعداد العشرية).
  Text-free: the two numbers under comparison (0.4 and 0.40) are shown as
  callout badges explained in localized HTML. Ticks are real values, so the
  picture teaches the actual concept (0.4 = 0.40 = four tenths).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" fill="url(#band)"/>

  <!-- Axis -->
  <line x1="80" y1="230" x2="880" y2="230" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M880,230 L858,220 L858,240 Z" fill="#334155"/>
  <path d="M80,230 L102,220 L102,240 Z" fill="#334155"/>

  <!-- Whole ticks 0..1 -->
  <g stroke="#334155" stroke-width="5" stroke-linecap="round">
    <line x1="80" y1="200" x2="80" y2="260"/>
    <line x1="880" y1="200" x2="880" y2="260"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#1e293b" text-anchor="middle">
    <text x="80" y="310">0</text>
    <text x="880" y="310">1</text>
  </g>

  <!-- Tenths ticks (0.1 .. 0.9): 10 equal parts -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="212" x2="160" y2="248"/>
    <line x1="240" y1="212" x2="240" y2="248"/>
    <line x1="320" y1="212" x2="320" y2="248"/>
    <line x1="400" y1="212" x2="400" y2="248"/>
    <line x1="480" y1="212" x2="480" y2="248"/>
    <line x1="560" y1="212" x2="560" y2="248"/>
    <line x1="640" y1="212" x2="640" y2="248"/>
    <line x1="720" y1="212" x2="720" y2="248"/>
    <line x1="800" y1="212" x2="800" y2="248"/>
  </g>
  <!-- Hundredths sub-ticks around 0.4 only -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="408" y1="220" x2="408" y2="240"/>
    <line x1="416" y1="220" x2="416" y2="240"/>
    <line x1="424" y1="220" x2="424" y2="240"/>
    <line x1="432" y1="220" x2="432" y2="240"/>
    <line x1="440" y1="220" x2="440" y2="240"/>
    <line x1="448" y1="220" x2="448" y2="240"/>
    <line x1="456" y1="220" x2="456" y2="240"/>
    <line x1="464" y1="220" x2="464" y2="240"/>
    <line x1="472" y1="220" x2="472" y2="240"/>
  </g>

  <!-- Marker at 0.4 (= 0.40) -->
  <g>
    <line x1="400" y1="150" x2="400" y2="230" stroke="#615bff" stroke-width="4" stroke-dasharray="8 6"/>
    <circle cx="400" cy="230" r="14" fill="#615bff" stroke="#fff" stroke-width="4"/>
    <circle cx="400" cy="118" r="34" fill="#fff" stroke="#615bff" stroke-width="5"/>
    <text x="400" y="130" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#615bff" text-anchor="middle">0.4</text>
  </g>

  <!-- Equal-value badge: 0.4 == 0.40 -->
  <g transform="translate(560,96)">
    <rect x="0" y="0" width="320" height="72" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <text x="160" y="48" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#15803d" text-anchor="middle">0.4 = 0.40</text>
  </g>

  <!-- Highlight the tenth segment from 0.4 to 0.5 -->
  <rect x="400" y="222" width="80" height="16" fill="#615bff" opacity="0.18"/>
</svg>
