<?xml version="1.0" encoding="UTF-8"?>
<!--
  Greatest common factor of 12 and 16 — off_math_u2_l5 (العامل المشترك الأكبر).
  Text-free: five numbered callouts. 1 the prime factors of 12 (2, 2, 3);
  2 the prime factors of 16 (2, 2, 2, 2); 3 the shared factors 2 and 2;
  4 the product of the shared factors 2 × 2; 5 the result, 4. Wording lives in
  the catalog's localized legend/alt, so no script is baked in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="gcdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#gcdBg)"/>

  <!-- Two overlapping sets -->
  <circle cx="360" cy="300" r="180" fill="#4338ca" opacity="0.35" stroke="#818cf8" stroke-width="5"/>
  <circle cx="600" cy="300" r="180" fill="#0e7490" opacity="0.35" stroke="#22d3ee" stroke-width="5"/>

  <!-- Numbers: 12's factors left, 16's factors right, shared in the middle -->
  <g font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <text x="300" y="360">3</text>
    <text x="470" y="240">2</text>
    <text x="470" y="360">2</text>
    <text x="660" y="240">2</text>
    <text x="660" y="360">2</text>
  </g>

  <!-- Set labels -->
  <g font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#c7d2fe">
    <text x="250" y="160">12</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#a5f3fc">
    <text x="710" y="160">16</text>
  </g>

  <!-- Shared factors highlighted -->
  <g font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#fde047">
    <text x="480" y="430">2 × 2</text>
  </g>

  <!-- Result -->
  <g font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" text-anchor="middle">
    <rect x="400" y="490" width="160" height="76" rx="18" fill="#065f46" stroke="#34d399" stroke-width="5"/>
    <text x="480" y="544" fill="#6ee7b7">4</text>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <circle cx="250" cy="110" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="250" y="122" fill="#4338ca">1</text>
    <circle cx="710" cy="110" r="26" fill="#ffffff" stroke="#0891b2" stroke-width="5"/>
    <text x="710" y="122" fill="#0e7490">2</text>
    <circle cx="480" cy="220" r="26" fill="#ffffff" stroke="#4338ca" stroke-width="5"/>
    <text x="480" y="232" fill="#4338ca">3</text>
    <circle cx="620" cy="430" r="26" fill="#ffffff" stroke="#ca8a04" stroke-width="5"/>
    <text x="620" y="442" fill="#a16207">4</text>
    <circle cx="600" cy="540" r="26" fill="#ffffff" stroke="#047857" stroke-width="5"/>
    <text x="600" y="552" fill="#047857">5</text>
  </g>
</svg>
