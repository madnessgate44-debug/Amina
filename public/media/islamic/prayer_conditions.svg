<?xml version="1.0" encoding="UTF-8"?>
<!--
  Conditions & sunnahs of prayer — off_isl_u1_l2 (فضل الصلاة وآدابها).
  Text-free: six numbered callouts. The top row (1-3) is three conditions of a
  valid prayer (its time, purity, facing the qibla); the bottom row (4-6) is
  three sunnahs (raising the hands, a short surah after Al-Fatihah, the
  remembrances of bowing and prostration). Wording lives in the catalog's
  localized legend/alt, so no script is baked into the picture.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
  <defs>
    <linearGradient id="islSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#islSky)"/>

  <!-- Decorative mosque silhouette (header, not a callout) -->
  <g opacity="0.5">
    <rect x="120" y="70" width="720" height="120" rx="16" fill="#0b3b38"/>
    <path d="M480,34 C520,64 540,86 480,96 C420,86 440,64 480,34 Z" fill="#0b3b38"/>
    <rect x="150" y="60" width="26" height="130" fill="#0b3b38"/>
    <rect x="784" y="60" width="26" height="130" fill="#0b3b38"/>
    <path d="M300,120 C330,92 360,120 360,150 L360,190 L300,190 Z" fill="#0b3b38"/>
    <path d="M600,120 C630,92 660,120 660,150 L660,190 L600,190 Z" fill="#0b3b38"/>
  </g>

  <!-- ── Row 1: three conditions ─────────────────────────────────────── -->

  <!-- 1: a clock = the prayer time has come -->
  <g transform="translate(70,220)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <circle cx="125" cy="80" r="52" fill="#ecfeff" stroke="#0891b2" stroke-width="6"/>
    <line x1="125" y1="80" x2="125" y2="48" stroke="#0e7490" stroke-width="7" stroke-linecap="round"/>
    <line x1="125" y1="80" x2="150" y2="92" stroke="#0e7490" stroke-width="7" stroke-linecap="round"/>
    <circle cx="125" cy="80" r="6" fill="#0e7490"/>
  </g>

  <!-- 2: a water drop = purity (wudu) -->
  <g transform="translate(355,220)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <path d="M125,30 C160,80 168,104 168,120 A43,43 0 1 1 82,120 C82,104 90,80 125,30 Z" fill="#7dd3fc" stroke="#0284c7" stroke-width="6"/>
    <path d="M108,112 A20,20 0 0 0 128,132" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 3: the Kaaba + direction arrow = facing the qibla -->
  <g transform="translate(640,220)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <rect x="96" y="44" width="86" height="86" rx="6" fill="#111827" stroke="#374151" stroke-width="5"/>
    <rect x="96" y="66" width="86" height="14" fill="#facc15"/>
    <path d="M50,88 L86,88" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <path d="M86,74 L104,88 L86,102 Z" fill="#dc2626"/>
  </g>

  <!-- ── Row 2: three sunnahs ─────────────────────────────────────────── -->

  <!-- 4: open hands raised = raising the hands / opening supplication -->
  <g transform="translate(70,410)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <path d="M96,120 L96,74 C96,64 108,64 108,74 L108,104" fill="none" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
    <path d="M108,104 L108,60 C108,50 120,50 120,60 L120,104" fill="none" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
    <path d="M120,104 L120,66 C120,56 132,56 132,66 L132,104" fill="none" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
    <path d="M132,104 L132,78 C132,68 144,68 144,78 L144,120 L96,120 Z" fill="#fcd34d" stroke="#b45309" stroke-width="6"/>
  </g>

  <!-- 5: an open book with a short chapter = a short surah after Al-Fatihah -->
  <g transform="translate(355,410)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <path d="M60,44 L124,58 L124,124 L60,110 Z" fill="#fef3c7" stroke="#92400e" stroke-width="5"/>
    <path d="M188,44 L124,58 L124,124 L188,110 Z" fill="#fde68a" stroke="#92400e" stroke-width="5"/>
    <line x1="124" y1="58" x2="124" y2="124" stroke="#92400e" stroke-width="5"/>
    <g stroke="#b45309" stroke-width="4" stroke-linecap="round">
      <line x1="74" y1="70" x2="110" y2="78"/>
      <line x1="74" y1="86" x2="110" y2="94"/>
      <line x1="138" y1="78" x2="174" y2="70"/>
      <line x1="138" y1="94" x2="174" y2="86"/>
    </g>
  </g>

  <!-- 6: a bowing figure = the remembrances of bowing and prostration -->
  <g transform="translate(640,410)">
    <rect x="0" y="0" width="250" height="160" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <circle cx="96" cy="58" r="18" fill="#f5d0a9" stroke="#b45309" stroke-width="5"/>
    <path d="M84,78 C110,74 150,86 172,110" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <path d="M96,84 L86,120" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <path d="M150,104 L150,120 L186,120" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Numbered callout markers -->
  <g font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle">
    <circle cx="96" cy="246" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="96" y="257" fill="#0f766e">1</text>
    <circle cx="381" cy="246" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="381" y="257" fill="#0f766e">2</text>
    <circle cx="666" cy="246" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="666" y="257" fill="#0f766e">3</text>
    <circle cx="96" cy="436" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="96" y="447" fill="#0f766e">4</text>
    <circle cx="381" cy="436" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="381" y="447" fill="#0f766e">5</text>
    <circle cx="666" cy="436" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="666" y="447" fill="#0f766e">6</text>
  </g>
</svg>
